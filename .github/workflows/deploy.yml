name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    outputs:
      pages_checks: ${{ steps.pages-checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare public article checks
        id: pages-checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/withbugs/kotatsu/issues?state=open&labels=type%3Aarticle&per_page=100' \
            --jq '.[] | select(.pull_request == null) | .number' \
            | node scripts/editorial/pages-verification.mjs prepare
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: 'Pages article #${{ matrix.issue }} / ${{ matrix.slug }}'
    needs: [build, deploy]
    if: needs.build.outputs.pages_checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.build.outputs.pages_checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live HTML and hero against the deployed build
        env:
          PAGES_CHECK: ${{ toJSON(matrix) }}
        run: node scripts/editorial/pages-verification.mjs verify
